apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-demo
  namespace: ai-cloud-labs
  labels:
    app: cloudops-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudops-demo

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: cloudops-demo

    spec:
      containers:
        - name: cloudops-demo
          image: ai-cloud-labs/cloudops-demo:latest

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
