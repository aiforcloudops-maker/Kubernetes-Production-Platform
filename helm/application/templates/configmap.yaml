apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops-application.fullname" . }}
  labels:
    {{- include "cloudops-application.labels" . | nindent 4 }}

data:
  ENVIRONMENT: {{ .Values.environment.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.environment.LOG_LEVEL | quote }}
  APP_NAME: {{ .Values.environment.APP_NAME | quote }}
