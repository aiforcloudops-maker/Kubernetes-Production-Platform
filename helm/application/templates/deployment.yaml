apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops-application.fullname" . }}
  labels:
    {{- include "cloudops-application.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "cloudops-application.selectorLabels" . | nindent 6 }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        {{- include "cloudops-application.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "cloudops-application.fullname" . }}

      containers:
        - name: cloudops-demo

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: {{ include "cloudops-application.fullname" . }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
