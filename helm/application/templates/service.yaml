apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops-application.fullname" . }}
  labels:
    {{- include "cloudops-application.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "cloudops-application.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
