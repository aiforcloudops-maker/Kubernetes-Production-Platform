replicaCount: 3

image:
  tag: stable

environment:
  ENVIRONMENT: production
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpuUtilization: 65
  memoryUtilization: 75
